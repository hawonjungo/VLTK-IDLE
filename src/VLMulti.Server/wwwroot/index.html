<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121314">
  <title>VLMulti</title>
  <link rel="stylesheet" href="app.css">
  <!-- Cài lên màn hình chính điện thoại như một app -->
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="icon" href="icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icon-192.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- Đăng nhập -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-box">
      <h1>VLMulti</h1>
      <input id="loginPassword" type="password" placeholder="Mật khẩu trang web" autocomplete="current-password" required>
      <button type="submit" class="btn primary">Đăng nhập</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- Màn chính: 4 màn chuyển bằng thanh dưới đáy -->
  <section id="main" class="hidden">
    <header class="appbar">
      <span class="brand">VLMulti</span>
      <span id="bossHk" class="boss-hk" title="Boss Hoàng Kim: 12:00 · 15:30 · 19:30 · 22:00 giờ Việt Nam, mỗi đợt 30 phút"></span>
      <button id="alertsBtn" class="icon-btn" aria-label="Cảnh báo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span id="alertsBadge" class="badge-dot hidden"></span>
      </button>
    </header>
    <div id="connBanner" class="conn-banner hidden" role="status"></div>

    <main class="views">
      <!-- Tổng quan -->
      <section id="view-home" class="view">
        <div id="pauseBar" class="pause-bar hidden"></div>
        <div id="totals" class="totals"></div>
        <div class="listbar">
          <span id="updated" class="dim"></span>
          <button id="selectBtn" class="pill-btn">Chọn</button>
        </div>
        <div id="accList" class="acc-list"></div>
      </section>

      <!-- Bảng chi tiết: cột tên nhân vật đứng yên khi kéo ngang -->
      <section id="view-table" class="view hidden">
        <h2 class="view-title">Bảng chi tiết</h2>
        <div class="table-wrap"><table id="table"></table></div>
      </section>

      <!-- Nhật ký chung của các acc -->
      <section id="view-log" class="view hidden">
        <h2 class="view-title">Nhật ký</h2>
        <div id="logKinds" class="chips-row"></div>
        <label class="log-acc">Acc <select id="logAcc"></select></label>
        <div id="logList" class="log-list"></div>
      </section>

      <!-- Cài đặt (dựng bằng JS khi mở) -->
      <section id="view-settings" class="view hidden">
        <h2 class="view-title">Cài đặt</h2>
        <div id="settingsBody"></div>
      </section>
    </main>

    <!-- Đổi chế độ cho các acc đã chọn -->
    <div id="selectBar" class="select-bar hidden">
      <div class="select-bar-head">
        <span id="selCount"></span>
        <button id="selAllBtn" class="link-btn">Chọn tất cả</button>
      </div>
      <div class="select-bar-modes">
        <button class="btn primary" data-mode="quest">Nhiệm Vụ</button>
        <button class="btn" data-mode="tower">Leo Tháp</button>
        <button class="btn" data-mode="dg">Phó Bản</button>
        <button class="btn" data-mode="farm">Luyện Công</button>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Điều hướng">
      <button data-view="home" aria-label="Tổng quan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Tổng quan</span>
      </button>
      <button data-view="table" aria-label="Bảng">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span>Bảng</span>
      </button>
      <button data-view="log" aria-label="Nhật ký">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Nhật ký</span>
      </button>
      <button data-view="settings" aria-label="Cài đặt">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span>Cài đặt</span>
      </button>
    </nav>
    <p id="toast" class="toast hidden" role="status"></p>
  </section>

  <!-- Hộp thoại dùng chung (trên điện thoại hiện như tấm trượt từ dưới lên) -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn" aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Live: xem trực tiếp một acc (cầm ngang thì nút dồn ra hai mép) -->
  <div id="live" class="live hidden">
    <div class="live-head">
      <button id="liveClose" class="icon-btn" aria-label="Đóng Live">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <b id="liveTitle"></b>
      <span id="liveInfo" class="live-info"></span>
    </div>
    <div class="live-stage">
      <canvas id="liveCanvas"></canvas>
      <div id="liveMsg" class="live-msg">Đang kết nối…</div>
    </div>
    <div class="live-tools">
      <button class="btn" data-wheel="-400" aria-label="Cuộn lên tại chỗ vừa chạm">▲</button>
      <button class="btn" data-wheel="400" aria-label="Cuộn xuống tại chỗ vừa chạm">▼</button>
      <button class="btn" data-key="Escape">Esc</button>
      <button class="btn" data-key="Enter">Enter</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
